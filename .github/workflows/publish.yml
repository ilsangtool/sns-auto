name: SNS 자동 게시

on:
  schedule:
    - cron: '7 * * * *'   # 매시 7분(UTC)에 확인 → posts.json의 시각이 지난 글을 게시
  workflow_dispatch:
    inputs:
      dry_run:
        description: '미리보기만 (실제 게시 안 함)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 게시
        run: |
          git config user.name "sns-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publish.mjs
        env:
          CLAIM_PUSH: 'true'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}

      - name: 게시 결과 기록
        if: always()
        run: |
          git config user.name "sns-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet && exit 0
          git commit -m "게시 결과 기록 [skip ci]"
          git pull --rebase && git push
