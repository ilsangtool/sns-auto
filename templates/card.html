<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    --c: {{color}};
    font-family: 'Pretendard', 'Noto Sans CJK KR', 'NanumGothic', sans-serif;
    background: #F5F3EE;
    color: #16171A;
    display: flex; flex-direction: column;
    padding: 88px 92px 0;
    word-break: keep-all;
    position: relative; overflow: hidden;
  }
  /* 배경 장식: 앱 색상의 큰 원 */
  body::before {
    content: ''; position: absolute; right: -220px; top: -220px;
    width: 620px; height: 620px; border-radius: 50%;
    background: var(--c); opacity: .09;
  }
  .top { display: flex; align-items: center; justify-content: space-between; position: relative; }
  .brand { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
  .brand b { color: var(--c); }
  .chip {
    font-size: 26px; font-weight: 600; color: var(--c);
    border: 2.5px solid var(--c); border-radius: 999px; padding: 10px 24px;
    max-width: 560px; background: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .bar { width: 72px; height: 10px; background: var(--c); border-radius: 5px; margin-bottom: 44px; }
  h1 { font-size: 96px; font-weight: 800; line-height: 1.22; letter-spacing: -3px; }
  .sub { font-size: 42px; font-weight: 500; color: #5A5D66; margin-top: 36px; line-height: 1.45; letter-spacing: -1px; }
  ul { list-style: none; margin-top: 72px; display: flex; flex-direction: column; gap: 26px; }
  li { display: flex; align-items: center; gap: 24px; font-size: 40px; font-weight: 600; letter-spacing: -0.8px; }
  li i {
    flex: none; width: 52px; height: 52px; border-radius: 14px; background: var(--c);
    display: grid; place-items: center;
  }
  li i::after {
    content: ''; width: 20px; height: 11px; margin-top: -6px;
    border-left: 5px solid #fff; border-bottom: 5px solid #fff; transform: rotate(-45deg);
  }
  .cta {
    margin: 0 -92px; padding: 46px 92px; background: var(--c); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 40px; font-weight: 700; letter-spacing: -0.8px;
  }
  .cta span { font-size: 30px; font-weight: 500; opacity: .85; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><b>●</b> {{brand}}</div>
    <div class="chip">{{app}}</div>
  </div>
  <div class="main">
    <div class="bar"></div>
    <h1>{{headline}}</h1>
    <p class="sub">{{sub}}</p>
    <ul>{{points}}</ul>
  </div>
  <div class="cta">{{cta}} <span>{{cta_sub}}</span></div>
</body>
</html>
