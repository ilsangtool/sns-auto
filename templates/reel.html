<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 릴스: 버건디 색면(B) · 1080×1920 · render(t)로 프레임 단위 렌더링 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; }
  body {
    --c: #6d1f2c; --bg: #faf7f1;
    --serif: "Noto Serif KR", "Noto Serif CJK KR", serif;
    font-family: "Pretendard", "Noto Sans CJK KR", sans-serif;
    background: var(--c); color: var(--bg); word-break: keep-all; position: relative; overflow: hidden;
  }
  .mk { width: 1em; height: 1em; color: var(--bg); }
  .hook, .stitle, .sdesc, .outro { text-wrap: balance; }

  /* 위쪽 약 220px은 인스타 상단 표시, 아래쪽 약 400px은 캡션이 덮으므로 그 사이에 배치 */
  .top { position: absolute; left: 96px; right: 96px; top: 240px; display: flex; justify-content: space-between; align-items: center; font-size: 32px; }
  .top b { font-family: var(--serif); font-size: 40px; font-weight: 700; display: flex; gap: 14px; align-items: center; }
  .top span { opacity: .85; max-width: 560px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog { position: absolute; left: 96px; right: 96px; top: 330px; height: 6px; background: rgba(250,247,241,.25); }
  .prog i { display: block; height: 100%; width: 0; background: var(--bg); }

  .scene { position: absolute; left: 96px; right: 96px; top: 420px; bottom: 640px;
           display: flex; flex-direction: column; justify-content: center; opacity: 0; }
  .anim { will-change: transform, opacity; }
  .kick { align-self: flex-start; font-size: 32px; border: 2px solid rgba(250,247,241,.6); padding: 10px 24px; margin-bottom: 48px; }
  .hook { font-family: var(--serif); font-size: 120px; font-weight: 600; line-height: 1.2; letter-spacing: -0.03em; }
  .num { font-family: var(--serif); font-size: 200px; line-height: 1; color: rgba(250,247,241,.38); font-weight: 700; }
  .stitle { font-family: var(--serif); font-size: 104px; font-weight: 600; line-height: 1.22; letter-spacing: -0.03em; margin-top: 24px; }
  .sdesc { font-size: 50px; color: rgba(250,247,241,.86); margin-top: 36px; line-height: 1.45; }
  .outro { font-family: var(--serif); font-size: 104px; font-weight: 600; line-height: 1.24; letter-spacing: -0.03em; }
  .free { align-self: flex-start; margin-top: 56px; font-size: 42px; font-weight: 600; border: 2px solid var(--bg); padding: 18px 36px; }

  .cta { position: absolute; left: 0; right: 0; bottom: 440px; height: 150px; padding: 0 96px; background: var(--bg); color: var(--c);
         display: flex; align-items: center; justify-content: space-between; font-size: 44px; font-weight: 700; }
  .cta span { font-family: var(--serif); font-weight: 600; font-size: 38px; }
</style>
</head>
<body>
  <div class="top">
    <b><svg class="mk" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 10h14M9 16h14M9 22h9" stroke="#6d1f2c" stroke-width="2.6" stroke-linecap="round"/></svg>{{brand}}</b>
    <span>{{cat}}</span>
  </div>
  <div class="prog"><i id="prog"></i></div>
  <div id="scenes"></div>
  <div class="cta">{{cta}}<span>{{cta_sub}}</span></div>

<script id="data" type="application/json">{{data}}</script>
<script>
  // 결정적(deterministic) 애니메이션: render(t)만 호출하면 해당 시각의 화면이 그려진다.
  const D = JSON.parse(document.getElementById('data').textContent);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HOOK = 3.2, STEP = 3.6, OUTRO = 3.6, FADE = 0.3;

  const scenes = [];
  const add = (html, dur) => { scenes.push({ html, dur }); };
  add(`<div class="kick anim">${esc(D.app)}</div><div class="hook anim">${esc(D.hook)}</div>`, HOOK);
  D.steps.forEach((s, i) => add(
    `<div class="num anim">0${i + 1}</div><div class="stitle anim">${esc(s.title)}</div><div class="sdesc anim">${esc(s.desc)}</div>`, STEP));
  add(`<div class="outro anim">${esc(D.outro)}</div>${D.badge ? `<div class="free anim">${esc(D.badge)}</div>` : ''}`, OUTRO);

  const root = document.getElementById('scenes');
  let start = 0;
  for (const s of scenes) {
    s.start = start; start += s.dur;
    s.el = document.createElement('div'); s.el.className = 'scene'; s.el.innerHTML = s.html; root.appendChild(s.el);
    s.parts = [...s.el.querySelectorAll('.anim')];
  }
  window.DURATION = start;

  const clamp = (x) => Math.max(0, Math.min(1, x));
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);

  // 제목이 넘치면 글자 크기 축소 (한 번만)
  for (const s of scenes) {
    s.el.style.opacity = 1;
    for (const big of s.el.querySelectorAll('.hook,.stitle,.outro')) {
      let size = parseFloat(getComputedStyle(big).fontSize);
      while (s.el.scrollHeight > s.el.clientHeight && size > 60) { size -= 4; big.style.fontSize = size + 'px'; }
    }
    s.el.style.opacity = 0;
  }

  window.render = (t) => {
    document.getElementById('prog').style.width = (clamp(t / start) * 100) + '%';
    for (const s of scenes) {
      const lt = t - s.start;
      if (lt < 0 || lt > s.dur) { s.el.style.opacity = 0; continue; }
      const last = s === scenes[scenes.length - 1];
      s.el.style.opacity = last ? 1 : clamp((s.dur - lt) / FADE);
      s.parts.forEach((p, i) => {
        const k = ease((lt - 0.12 * i) / 0.55);
        p.style.opacity = k;
        p.style.transform = `translateY(${(1 - k) * 48}px)`;
      });
    }
  };
  render(0);
</script>
</body>
</html>
