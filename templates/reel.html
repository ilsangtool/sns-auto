<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; }
  body {
    --c: {{color}};
    font-family: 'Pretendard', 'Noto Sans CJK KR', 'NanumGothic', sans-serif;
    background: #F5F3EE; color: #16171A;
    word-break: keep-all; position: relative; overflow: hidden;
  }
  .blob { position: absolute; border-radius: 50%; background: var(--c); opacity: .09; }
  #b1 { width: 760px; height: 760px; right: -260px; top: -200px; }
  #b2 { width: 520px; height: 520px; left: -240px; bottom: 160px; opacity: .06; }

  .top { position: absolute; left: 92px; right: 92px; top: 240px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 38px; font-weight: 800; letter-spacing: -0.5px; }
  .brand b { color: var(--c); }
  .chip { font-size: 28px; font-weight: 600; color: var(--c); border: 3px solid var(--c); border-radius: 999px;
          padding: 10px 26px; max-width: 600px; background: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 진행 막대 */
  .prog { position: absolute; left: 92px; right: 92px; top: 340px; height: 8px; border-radius: 4px; background: rgba(0,0,0,.08); }
  .prog i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--c); }

  .scene { position: absolute; left: 92px; right: 92px; top: 420px; bottom: 640px;
           display: flex; flex-direction: column; justify-content: center; opacity: 0; }
  .anim { will-change: transform, opacity; }
  .bar { width: 84px; height: 12px; background: var(--c); border-radius: 6px; margin-bottom: 52px; }
  .hook { font-size: 108px; font-weight: 800; line-height: 1.22; letter-spacing: -3.5px; }
  .num { width: 128px; height: 128px; border-radius: 34px; background: var(--c); color: #fff;
         display: grid; place-items: center; font-size: 72px; font-weight: 800; margin-bottom: 56px; }
  .stitle { font-size: 92px; font-weight: 800; line-height: 1.24; letter-spacing: -3px; }
  .sdesc { font-size: 50px; font-weight: 500; color: #5A5D66; margin-top: 44px; line-height: 1.45; letter-spacing: -1px; }
  .outro { font-size: 92px; font-weight: 800; line-height: 1.25; letter-spacing: -3px; }
  .outro em { font-style: normal; color: var(--c); }
  .free { display: inline-block; margin-top: 56px; font-size: 44px; font-weight: 700; color: #fff; background: var(--c);
          border-radius: 999px; padding: 22px 44px; align-self: flex-start; }

  /* 하단 약 400px은 인스타·스레드 캡션이 덮으므로 그 위에 배치 */
  .cta { position: absolute; left: 92px; right: 92px; bottom: 440px; height: 150px; padding: 0 48px; border-radius: 36px; background: var(--c); color: #fff;
         display: flex; align-items: center; justify-content: space-between; font-size: 44px; font-weight: 700; letter-spacing: -0.8px; }
  .cta span { font-size: 34px; font-weight: 500; opacity: .85; }
</style>
</head>
<body>
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div>
  <div class="top"><div class="brand"><b>●</b> {{brand}}</div><div class="chip">{{app}}</div></div>
  <div class="prog"><i id="prog"></i></div>
  <div id="scenes"></div>
  <div class="cta">{{cta}} <span>{{cta_sub}}</span></div>

<script id="data" type="application/json">{{data}}</script>
<script>
  // 결정적(deterministic) 애니메이션: render(t)만 호출하면 해당 시각의 화면이 그려진다.
  const D = JSON.parse(document.getElementById('data').textContent);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HOOK = 3.2, STEP = 3.6, OUTRO = 3.6, FADE = 0.3;

  const scenes = [];
  const add = (html, dur) => { scenes.push({ html, dur }); };
  add(`<div class="bar anim"></div><div class="hook anim">${esc(D.hook)}</div>`, HOOK);
  D.steps.forEach((s, i) => add(
    `<div class="num anim">${i + 1}</div><div class="stitle anim">${esc(s.title)}</div><div class="sdesc anim">${esc(s.desc)}</div>`, STEP));
  add(`<div class="outro anim">${esc(D.outro)}</div>${D.badge ? `<div class="free anim">${esc(D.badge)}</div>` : ''}`, OUTRO);

  const root = document.getElementById('scenes');
  let start = 0;
  for (const s of scenes) {
    s.start = start; start += s.dur;
    s.el = document.createElement('div'); s.el.className = 'scene'; s.el.innerHTML = s.html; root.appendChild(s.el);
    s.parts = [...s.el.querySelectorAll('.anim')];
  }
  window.DURATION = start;

  const clamp = (x) => Math.max(0, Math.min(1, x));
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);

  // 제목이 넘치면 글자 크기 축소 (한 번만)
  for (const s of scenes) {
    s.el.style.opacity = 1;
    for (const big of s.el.querySelectorAll('.hook,.stitle,.outro')) {
      let size = parseFloat(getComputedStyle(big).fontSize);
      while (s.el.scrollHeight > s.el.clientHeight && size > 60) { size -= 4; big.style.fontSize = size + 'px'; }
    }
    s.el.style.opacity = 0;
  }

  window.render = (t) => {
    document.getElementById('prog').style.width = (clamp(t / start) * 100) + '%';
    for (const s of scenes) {
      const lt = t - s.start;
      if (lt < 0 || lt > s.dur) { s.el.style.opacity = 0; continue; }
      const last = s === scenes[scenes.length - 1];
      s.el.style.opacity = last ? 1 : clamp((s.dur - lt) / FADE);
      s.parts.forEach((p, i) => {
        const k = ease((lt - 0.12 * i) / 0.55);
        p.style.opacity = k;
        p.style.transform = `translateY(${(1 - k) * 60}px)`;
      });
    }
    const pulse = 1 + 0.03 * Math.sin(t * 1.6);
    document.getElementById('b1').style.transform = `scale(${pulse})`;
  };
  render(0);
</script>
</body>
</html>
